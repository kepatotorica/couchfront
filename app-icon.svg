<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eedf"/>
      <stop offset="1" stop-color="#e4cfb0"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="470" fill="url(#badge)"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#d6bc98" stroke-opacity="0.55" stroke-width="33"/>

  <!-- A big, plump couch filling most of the badge: separated parts so the
       beige gaps still read as backrest / arms / seat / legs at 32px. -->
  <g fill="#7b4a2b">
    <!-- backrest -->
    <rect x="246" y="284" width="532" height="200" rx="78" />
    <!-- arms, taller than the seat and rounded on top -->
    <rect x="150" y="412" width="138" height="270" rx="68" />
    <rect x="736" y="412" width="138" height="270" rx="68" />
    <!-- seat -->
    <rect x="296" y="516" width="432" height="140" rx="50" />
    <!-- legs -->
    <rect x="320" y="640" width="54" height="100" rx="26" />
    <rect x="650" y="640" width="54" height="100" rx="26" />
  </g>

  <!-- A controller resting on the seat, cut out of the brown in the badge beige -->
  <rect x="430" y="552" width="164" height="70" rx="35" fill="#efe0c9" />
  <g fill="#7b4a2b">
    <rect x="456" y="581" width="36" height="12" rx="6" />
    <rect x="468" y="569" width="12" height="36" rx="6" />
    <circle cx="548" cy="578" r="9" />
    <circle cx="570" cy="596" r="9" />
  </g>
</svg>
